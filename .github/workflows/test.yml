# The site's tests on every push: built once, served, read as a visitor
# and a link preview read it, and measured in a real browser.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The build and the endpoint read GitHub's releases list; the
      # workflow's own token keeps a busy runner clear of the anonymous
      # sixty-an-hour limit.
      - run: bun run test
        env:
          GITHUB_TOKEN: ${{ github.token }}
